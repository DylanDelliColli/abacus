# ABACUS provider lock, schema v1.
#
# Paths are deliberately absent: the composition root resolves executables from
# explicit configuration, then adapters verify these identities before use.
# `br` and Herdr mismatches fail closed. `bv` is advice-only and degrades to the
# deterministic core ordering on any identity or contract mismatch.
# Fixture-set names identify the checked-in Phase 1 evidence corpus. Adapter-owned
# minimal fixtures replace/extend that corpus during their implementation phases.

schema_version = 1
target_os = "linux"
target_arch = "x86_64"
validated_on = "2026-08-04"

[providers.br]
canonical_name = "br"
role = "work-graph"
upstream = "Dicklesworthstone/beads_rust"
version = "0.1.45"
release = "v0.1.45"
release_asset = "br-v0.1.45-linux_amd64.tar.gz"
release_asset_sha256 = "578fa277c123a689bb1077445cb2093e894c250517abc944d4715a4e054ee391"
binary_sha256 = "a3b59c6bde363efe251c28a7908d169f7b5671a22894e9577d253983750339e3"
mismatch_policy = "fail-closed"
machine_interface = "json-cli-plus-jsonl-content-hash"
fixture_set = "abacus-work/fixtures/br-v0.1.45"
fixture_set_version = 1
compatibility_record = "docs/compatibility/2026-08-04-br-bv.md"
required_operations = [
  "init",
  "info",
  "show",
  "list",
  "ready",
  "create",
  "update",
  "label-add",
  "dependency-add",
  "dependency-remove",
  "status-in-progress",
  "close",
  # Reserved for explicit operator reconciliation of an out-of-band close.
  "reopen",
  "sync-status",
  "sync-flush",
  "doctor",
]
required_properties = [
  "case-insensitive-provider-id-mapping",
  "scope-label-key-colon-value-max-50-bytes",
  "curated-close-reason",
  "structured-errors",
  "explicit-control-checkout",
]

