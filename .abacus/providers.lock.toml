release_asset_sha256 = "b872ea7e40fa2cb17e857ac9b62b1bf26db7b403c622f5d2f3f5b35f6e9acd28"
# Herdr publishes this target as a raw executable, so asset and binary hashes match.
binary_sha256 = "b872ea7e40fa2cb17e857ac9b62b1bf26db7b403c622f5d2f3f5b35f6e9acd28"
mismatch_policy = "fail-closed"
api_schema_version = 1
api_protocol = 19
api_schema_bytes = 251527
api_schema_sha256 = "88ff414aa996e390c2db05a37b95d28dbe4e81b98329f6ed7f7a2cc5c6ebf51a"
fixture_set = "compatibility-2026-08-04-herdr-v0.7.5-to-v0.8.0"
fixture_set_version = 2
compatibility_record = "docs/compatibility/2026-08-04-herdr.md"
supported_agent_kinds = ["claude", "codex"]
required_operations = [
  "status-server",
  "api-snapshot",
  "workspace-create",
  "workspace-list",
  "pane-read-bounded",
  "pane-process-info",
  "agent-start",
  "agent-prompt",
  # ADR-0003 startup exception: pinned JSON socket method, host-side only.
  "socket-agent-prompt-startup",
  "agent-wait",
  "agent-read",
  # Blocked-dialog cancellation and diagnostics only; never prompt delivery.
  "agent-send-keys",
  "server-live-handoff",
  "server-stop",
  "session-list",
  "session-delete",
]
required_properties = [
  "operator-owned-host-facade",
  "collision-resistant-named-session",
  "no-global-integrations",
  "no-prompt-submit-keystroke-fallback",
  "startup-material-json-not-argv-env-source-verified",
  "send-keys-only-for-dialog-cancel-or-diagnostics",
  "ambiguous-prompt-timeout-no-retry",
  "generation-fenced-reassociation",
  "pull-based-status-snapshots",
]

[providers.herdr.detectors]
source_policy = "active-remote-manifest-with-no-local-override"
drift_policy = "detector-dependent-observations-incompatible-until-revalidated"

